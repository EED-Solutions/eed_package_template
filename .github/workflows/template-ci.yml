name: validate-copier-template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:


jobs:
  validate-template:
    name: Validate generated project
    runs-on: ubuntu-latest
    steps:
      - name: "checkout repository"
        uses: actions/checkout@v4
      - name: "install uv"
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: "render template"
        shell: bash
        run: |
          rendered_dir="${RUNNER_TEMP}/eed-ci-template"
          uvx copier copy --defaults --trust --vcs-ref HEAD \
            --data project_name=eed-ci-template \
            --data package_slug=eed_ci_template \
            --data description="Generated by template CI" \
            --data package_version=0.1.0 \
            --data github_org=EED-Solutions \
            "${GITHUB_WORKSPACE}" "${rendered_dir}"
          test -f "${rendered_dir}/.github/workflows/publish.yml"
          echo "rendered_dir=${rendered_dir}" >> "$GITHUB_ENV"
      - name: "install generated dependencies"
        shell: bash
        run: |
          cd "${rendered_dir}"
          uv sync --locked
      - name: "run generated tests with coverage"
        shell: bash
        run: |
          cd "${rendered_dir}"
          uv run pytest --cov=eed_ci_template --cov-fail-under=90 --cov-report=term-missing tests
      - name: "run generated lint"
        shell: bash
        run: |
          cd "${rendered_dir}"
          uv run ruff check .
